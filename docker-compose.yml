services:
  postgres:
    image: postgres:18
    container_name: personal-finance-postgres
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d personal_finance"]
      interval: 10s
      timeout: 5s
      retries: 5
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: personal-finance-server
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/personal_finance
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BREVO_SMTP_HOST: ${BREVO_SMTP_HOST}
      BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD}
      BREVO_MAIL_FROM: ${BREVO_MAIL_FROM}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      OTP_EXPIRATION: ${OTP_EXPIRATION}
      OTP_RESEND_DELAY: ${OTP_RESEND_DELAY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: personal-finance-frontend
    ports:
      - "5173:80"
    depends_on:
      - server
volumes:
  postgres_data:
